
name: Kiem tra Frontend va Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dat thu vien
        run: pip install -r backend/requirements-dev.txt

      - name: Chay kiem thu
        run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cai dat thu vien
        run: npm ci

      - name: Kiem tra build
        run: npm run build
