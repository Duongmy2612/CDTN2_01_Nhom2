# Kiểm thử tự động mỗi lần đẩy code lên main/develop hoặc mở pull request vào hai nhánh này (DoD mục 5.3 báo cáo buổi 3:
# mã chỉ được gộp vào develop khi kiểm thử đạt và có ít nhất một thành viên khác xem lại).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend – pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # kiểm thử chạy trên dữ liệu tổng hợp (backend/tests/synth.py) và máy chủ Gemini giả lập – không cần dữ liệu gốc, không cần khóa
      - run: pytest backend/tests -q

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
