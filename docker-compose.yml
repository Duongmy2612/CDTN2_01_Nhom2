services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    ports: ["8000:8000"]
    env_file:
      - path: backend/.env     # sao chép từ .env.example; không bắt buộc nếu chưa dùng trợ lý AI
        required: false
    volumes:
      - ./backend/data:/app/backend/data      # dữ liệu gốc/trung gian không đóng gói vào image
      - ./backend/models:/app/backend/models
      - ./backend/cache:/app/backend/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 24              # nạp lại kết quả phiên trước (toàn bộ Reviews.csv) có thể mất vài chục giây
      start_period: 10s
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["5173:5173"]
    environment: [BACKEND_URL=http://backend:8000]
    depends_on:
      backend:
        condition: service_healthy   # chỉ mở giao diện khi backend đã trả /api/health – tránh lỗi proxy 502 lúc vừa khởi động
